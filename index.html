<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zimbabwe Clinic Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f5;
      color: #173b3a;
    }

    /* Header */
    header {
      background: #123b3a;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      color: #c7dddd;
    }

    /* Main map area */
    main {
      padding: 20px;
    }

    .map-container {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .map-header {
      padding: 15px 20px;
      border-bottom: 1px solid #e1e7e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .map-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .map-header span {
      font-size: 12px;
      color: #667c7a;
    }

    #map {
      width: 100%;
      height: calc(100vh - 150px);
      min-height: 500px;
    }

    /* Loading message */
    #status {
      padding: 10px 20px;
      font-size: 12px;
      color: #667c7a;
      border-top: 1px solid #e1e7e5;
    }

    /* Popup */
    .popup-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #123b3a;
    }

    .popup-row {
      font-size: 12px;
      margin: 4px 0;
      color: #444;
    }

    .popup-row strong {
      color: #123b3a;
    }

    @media (max-width: 700px) {
      header {
        padding: 15px;
      }

      header h1 {
        font-size: 18px;
      }

      main {
        padding: 10px;
      }

      #map {
        height: calc(100vh - 125px);
        min-height: 450px;
      }

      .map-header {
        padding: 12px 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>Zimbabwe Clinic Map</h1>
      <p>Geographic distribution of health facilities in Zimbabwe</p>
    </div>
  </header>

  <main>
    <div class="map-container">

      <div class="map-header">
        <h2>Health Facility Distribution</h2>
        <span>Leaflet Interactive Map</span>
      </div>

      <div id="map"></div>

      <div id="status">
        Loading health facilities...
      </div>

    </div>
  </main>


  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    /*
      ---------------------------------------------------------
      INITIALISE MAP
      ---------------------------------------------------------
    */

    const map = L.map("map").setView(
      [-19.0154, 29.1549],
      6
    );


    /*
      ---------------------------------------------------------
      BASE MAP
      ---------------------------------------------------------
    */

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /*
      ---------------------------------------------------------
      GEOJSON STYLE
      ---------------------------------------------------------
    */

    function clinicPoint(feature, latlng) {

      return L.circleMarker(latlng, {
        radius: 6,
        fillColor: "#087f78",
        color: "#ffffff",
        weight: 1.5,
        opacity: 1,
        fillOpacity: 0.9
      });

    }


    /*
      ---------------------------------------------------------
      CREATE POPUP FROM ACTUAL GEOJSON ATTRIBUTES
      ---------------------------------------------------------
    */

    function createPopup(feature, layer) {

      const properties = feature.properties || {};

      let popupContent = `
        <div class="popup-title">
          Health Facility
        </div>
      `;

      const entries = Object.entries(properties);

      if (entries.length === 0) {

        popupContent += `
          <div class="popup-row">
            No attribute information available.
          </div>
        `;

      } else {

        entries.forEach(([key, value]) => {

          if (
            value !== null &&
            value !== undefined &&
            value !== ""
          ) {

            popupContent += `
              <div class="popup-row">
                <strong>${escapeHTML(key)}:</strong>
                ${escapeHTML(value)}
              </div>
            `;

          }

        });

      }

      layer.bindPopup(popupContent);

    }


    /*
      ---------------------------------------------------------
      LOAD GEOJSON AUTOMATICALLY
      ---------------------------------------------------------

      The file MUST be called:

          clinics.geojson

      and must be in the same folder as index.html.
    */

    fetch("clinics.geojson")

      .then(response => {

        if (!response.ok) {
          throw new Error(
            "clinics.geojson could not be found."
          );
        }

        return response.json();

      })

      .then(data => {

        /*
          Add the GeoJSON to the Leaflet map
        */

        const clinicLayer = L.geoJSON(data, {

          pointToLayer: clinicPoint,

          onEachFeature: createPopup

        }).addTo(map);


        /*
          Automatically zoom the map to the
          extent of the clinic data.
        */

        if (clinicLayer.getBounds().isValid()) {

          map.fitBounds(
            clinicLayer.getBounds(),
            {
              padding: [30, 30]
            }
          );

        }


        /*
          Update only the status message.
          No statistics are calculated.
        */

        document.getElementById("status").textContent =
          "Health facilities successfully loaded from GeoJSON.";

      })

      .catch(error => {

        console.error(error);

        document.getElementById("status").textContent =
          "Unable to load the clinic GeoJSON dataset.";

      });


    /*
      ---------------------------------------------------------
      SECURITY / POPUP TEXT HANDLING
      ---------------------------------------------------------
    */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
